<!DOCTYPE html>
<html>
<head>
    <title>iKhokha API Test</title>
</head>
<body>
    <h1>Testing iKhokha API Connection</h1>
    <button onclick="testAPI()">Test iKhokha API</button>
    <pre id="result"></pre>

    <script>
        async function generateSignature(path, body, secret) {
            const encoder = new TextEncoder();
            const data = encoder.encode(path + body);
            const key = await crypto.subtle.importKey(
                'raw',
                encoder.encode(secret),
                { name: 'HMAC', hash: 'SHA-256' },
                false,
                ['sign']
            );
            const signature = await crypto.subtle.sign('HMAC', key, data);
            const hashArray = Array.from(new Uint8Array(signature));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';

            const IKHOKHA_APP_ID = 'IKW31E1I5WP1HT2KIIB2XZMBXJOFDX5D';
            const IKHOKHA_APP_SECRET = '455rtQjghdOHzLN3YZ3AQ81H3KEf7OeS';
            
            const payload = {
                entityID: IKHOKHA_APP_ID,
                externalEntityID: 'test-user-123',
                amount: 10000,
                currency: 'ZAR',
                requesterUrl: 'http://localhost:3002',
                mode: 'live',
                description: 'Test Payment',
                externalTransactionID: 'TEST-' + Date.now(),
                urls: {
                    callbackUrl: 'http://localhost:3002/webhook',
                    successPageUrl: 'http://localhost:3002/success',
                    failurePageUrl: 'http://localhost:3002/failure',
                    cancelUrl: 'http://localhost:3002/cancel'
                }
            };

            const requestBody = JSON.stringify(payload);
            const path = '/public-api/v1/api/payment';
            
            try {
                const signature = await generateSignature(path, requestBody, IKHOKHA_APP_SECRET);
                
                resultEl.textContent = `Signature: ${signature.substring(0, 20)}...\n\nCalling iKhokha API...\n`;
                
                const response = await fetch('https://api.ikhokha.com' + path, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'IK-APPID': IKHOKHA_APP_ID,
                        'IK-SIGN': signature
                    },
                    body: requestBody
                });

                resultEl.textContent += `\nStatus: ${response.status}\n\n`;
                
                const result = await response.json();
                resultEl.textContent += JSON.stringify(result, null, 2);
                
            } catch (error) {
                resultEl.textContent = 'ERROR: ' + error.message + '\n\n' + error.stack;
            }
        }
    </script>
</body>
</html>
